[project]
name = "autopilot-adapter-filesystem"
version = "0.1.0"
description = "SourceAdapter implementation for local/network filesystems. Tier 1 deep-dive coverage"
requires-python = ">=3.11"
dependencies = ["autopilot-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autopilot_adapter_filesystem"]

[tool.uv.sources]
autopilot-core = { workspace = true }
