[project]
name = "autopilot-adapter-sharepoint"
version = "0.1.0"
description = "SourceAdapter implementation for SharePoint via Microsoft Graph SDK. Tier 2 coverage"
requires-python = ">=3.11"
dependencies = ["autopilot-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autopilot_adapter_sharepoint"]

[tool.uv.sources]
autopilot-core = { workspace = true }
