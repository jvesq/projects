[project]
name = "autopilot-adapter-snowflake"
version = "0.1.0"
description = "SourceAdapter implementation for Snowflake sources. Tier 2 coverage"
requires-python = ">=3.11"
dependencies = ["autopilot-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autopilot_adapter_snowflake"]

[tool.uv.sources]
autopilot-core = { workspace = true }
