[project]
name = "autopilot-adapter-sap"
version = "0.1.0"
description = "SourceAdapter implementation for SAP via pyrfc. Tier 1 deep-dive coverage, pilot-critical"
requires-python = ">=3.11"
dependencies = ["autopilot-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autopilot_adapter_sap"]

[tool.uv.sources]
autopilot-core = { workspace = true }
