[project]
name = "autopilot-adapter-s3"
version = "0.1.0"
description = "SourceAdapter implementation for S3-compatible object storage. Tier 1 standard coverage"
requires-python = ">=3.11"
dependencies = ["autopilot-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autopilot_adapter_s3"]

[tool.uv.sources]
autopilot-core = { workspace = true }
