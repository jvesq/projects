[project]
name = "autopilot-pipeline-orchestrator"
version = "0.1.0"
description = "Owns onboarding job lifecycle, produces stage-input events, tracks per-job state, gates retrieve on customer confirmation"
requires-python = ">=3.11"
dependencies = ["autopilot-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autopilot_pipeline_orchestrator"]

[tool.uv.sources]
autopilot-core = { workspace = true }

