[project]
name = "autopilot-adapter-pool"
version = "0.1.0"
description = "Shared runtime that discovers and hosts SourceAdapter implementations, exposing them uniformly to workers and the agent's MCP tool surface"
requires-python = ">=3.11"
dependencies = ["autopilot-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autopilot_adapter_pool"]

[tool.uv.sources]
autopilot-core = { workspace = true }

