[project]
name = "autopilot-agent-runtime"
version = "0.1.0"
description = "Hosts the Claude Agent SDK session per customer and the provider-agnostic Agent Runtime Layer (prompt orchestration, tool-call normalization, provider routing)"
requires-python = ">=3.11"
dependencies = ["autopilot-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autopilot_agent_runtime"]

[tool.uv.sources]
autopilot-core = { workspace = true }

