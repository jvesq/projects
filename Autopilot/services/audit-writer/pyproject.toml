[project]
name = "autopilot-audit-writer"
version = "0.1.0"
description = "Async consumer writing append-only, signed audit records from every other service"
requires-python = ">=3.11"
dependencies = ["autopilot-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autopilot_audit_writer"]

[tool.uv.sources]
autopilot-core = { workspace = true }

