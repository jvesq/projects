[project]
name = "autopilot-observability"
version = "0.1.0"
description = "Shared OpenTelemetry instrumentation, metrics catalog, and structured logging conventions used across services"
requires-python = ">=3.11"
dependencies = ["autopilot-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autopilot_observability"]

[tool.uv.sources]
autopilot-core = { workspace = true }

