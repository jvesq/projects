[project]
name = "autopilot-stage-workers"
version = "0.1.0"
description = "Kafka consumer framework running the eight pipeline stages: discover, classify, retrieve, map, dqa, enrich, anomaly, serialize"
requires-python = ">=3.11"
dependencies = ["autopilot-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autopilot_stage_workers"]

[tool.uv.sources]
autopilot-core = { workspace = true }

